services:
  todo:
    build: .
    container_name: todo-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      ADMIN_USERNAME: marco
      ADMIN_DISPLAY_NAME: Marco
      # Hinter einem Reverse-Proxy mit HTTPS (empfohlen):
      # TRUST_PROXY: "true"
      # VAPID_SUBJECT: mailto:du@example.com
    volumes:
      - todo-data:/data

volumes:
  todo-data:
